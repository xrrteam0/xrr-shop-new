<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XRR Admin</title><link rel="stylesheet" href="/styles.css"><style>.admin{max-width:900px;margin:55px auto;padding:0 22px}.admin h1{font-size:50px;letter-spacing:-4px}.admin-card{border:1px solid #333;background:#111;padding:24px;margin:20px 0}.admin label{display:block;color:#aaa;font-size:11px;margin:13px 0 6px}.admin input,.admin textarea,.admin select{width:100%}.admin textarea{min-height:80px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.actions{display:flex;gap:10px;margin-top:20px}.secondary{background:transparent;border:1px solid #555;color:white;padding:12px 15px}.item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333;padding:15px 0;gap:15px}.small{font-size:11px;color:#999}@media(max-width:600px){.formgrid{grid-template-columns:1fr}.admin h1{font-size:40px}}</style></head><body><header class="top"><a class="brand" href="/">XRR<span>.</span></a><nav><a href="/">View store</a></nav><span class="eyebrow">CONTROL PANEL</span></header><main class="admin"><div class="eyebrow">XRR / PRIVATE AREA</div><h1>PRODUCT MANAGER<span style="color:#ff1830">.</span></h1><section id="login" class="admin-card"><h2>Admin access</h2><p class="small">Enter the ADMIN_PASSWORD configured in your Netlify environment variables.</p><label>Admin password</label><input id="password" type="password" autocomplete="current-password"><div class="actions"><button class="buy" id="loginBtn">Sign in</button></div><p id="loginError" class="small"></p></section><section id="panel" hidden><div class="admin-card"><h2 id="formTitle">Add product</h2><input id="pid" type="hidden"><div class="formgrid"><div><label>Product name</label><input id="name" placeholder="e.g. Creator Toolkit"></div><div><label>Category</label><input id="cat" placeholder="Templates, Automation…"></div><div><label>Price (EUR)</label><input id="price" type="number" min="0.01" step="0.01"></div><div><label>Delivery URL (HTTPS)</label><input id="url" placeholder="https://..."></div></div><label>Description</label><textarea id="desc" placeholder="What does the customer receive?"></textarea><label><input id="active" type="checkbox" checked style="width:auto"> Visible in shop</label><div class="actions"><button class="buy" id="save">Save product</button><button class="secondary" id="clear">Clear</button></div><p class="small" id="status"></p></div><div class="admin-card"><h2>Your products</h2><div id="list"></div></div><button class="secondary" id="logout">Sign out</button></section></main><script src="/admin.js"></script></body></html>
