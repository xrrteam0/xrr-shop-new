<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment — XRR</title><link rel="stylesheet" href="/styles.css"></head><body><header class="top"><a class="brand" href="/">XRR<span>.</span></a></header><main class="admin"><div class="eyebrow">XRR / CHECKOUT</div><h1>VERIFYING<br><em>PAYMENT.</em></h1><div id="result" class="admin-card">Checking PayPal confirmation…</div><a class="buy" href="/">Back to store</a></main><script>const box=document.getElementById("result");(async()=>{const id=new URLSearchParams(location.search).get("token");if(!id){box.textContent="No PayPal order was supplied.";return}try{const r=await fetch("/api/paypal/capture-order",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({orderId:id})});const d=await r.json();if(!r.ok)throw Error(d.error||"Payment verification failed");box.innerHTML=d.downloadUrl?'<h2>Payment confirmed.</h2><p>Your digital product is ready.</p><a class="buy" href="'+d.downloadUrl.replace(/&/g,"&amp;")+'" rel="noopener">Download product ↗</a>':"<h2>Payment confirmed.</h2><p>"+(d.message||"Thank you.")+"</p>"}catch(e){box.textContent=e.message}})();</script></body></html>
